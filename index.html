<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>晚上好好学习！</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            padding: 20px;
        }
        
        .container {
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            padding: 40px;
            width: 100%;
            max-width: 500px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        
        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: linear-gradient(90deg, #000, #fff);
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }
        
        .message {
            color: #555;
            margin-bottom: 30px;
            font-size: 18px;
            line-height: 1.5;
            min-height: 54px;
        }
        
        .buttons-container {
            position: relative;
            height: 200px;
            margin-top: 30px;
        }
        
        #agree-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 15px 40px;
            font-size: 18px;
            font-weight: bold;
            background-color: black;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            z-index: 10;
        }
        
        #agree-btn:hover:not(.disabled) {
            background-color: #333;
            transform: translate(-50%, -50%) scale(1.05);
        }
        
        #agree-btn.disabled {
            background-color: #666;
            cursor: not-allowed;
        }
        
        #reject-btn {
            position: absolute;
            padding: 15px 40px;
            font-size: 18px;
            font-weight: bold;
            background-color: #ff4d4d;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.1s ease;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            z-index: 5;
        }
        
        #reject-btn:hover:not(.disabled) {
            background-color: #ff3333;
        }
        
        #reject-btn.disabled {
            background-color: #ff9999;
            cursor: not-allowed;
        }
        
        .counter {
            margin-top: 20px;
            color: #777;
            font-size: 16px;
        }
        
        .plead-message {
            margin-top: 15px;
            color: #ff4d4d;
            font-size: 20px;
            font-weight: bold;
            height: 30px;
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        
        .plead-message.show {
            opacity: 1;
        }
        
        .thank-message {
            margin-top: 15px;
            color: #4CAF50;
            font-size: 18px;
            font-weight: bold;
            height: 30px;
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        
        .thank-message.show {
            opacity: 1;
        }
        
        .countdown {
            margin-top: 20px;
            font-size: 24px;
            font-weight: bold;
            color: #4CAF50;
            height: 30px;
        }
        
        .hidden {
            display: none;
        }
        
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            opacity: 0;
            visibility: hidden;
            transition: all 0.5s ease;
            z-index: 100;
        }
        
        .overlay.show {
            opacity: 1;
            visibility: visible;
        }
        
        .overlay h2 {
            color: #4CAF50;
            margin-bottom: 20px;
        }
        
        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: #f00;
            opacity: 0;
        }
        
        @keyframes confetti-fall {
            0% {
                transform: translateY(-100px) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>意愿访问</h1>
        <p class="message" id="main-message">点到拒绝就不用学了</p>
        
        <div class="buttons-container">
            <button id="agree-btn">同意</button>
            <button id="reject-btn">拒绝</button>
        </div>
        
        <div class="counter">拒绝按钮被点击: <span id="counter">0</span> 次</div>
        <div class="plead-message" id="plead-message">同意吧，好好学习</div>
        <div class="thank-message" id="thank-message">追风赶月莫停留，平芜尽处是春山</div>
        <div class="countdown" id="countdown"></div>
        
        <div class="overlay" id="overlay">
            <h2>学习已同意！</h2>
            <p>别打瞌睡哦！</p>
        </div>
    </div>

    <script>
        const agreeBtn = document.getElementById('agree-btn');
        const rejectBtn = document.getElementById('reject-btn');
        const buttonsContainer = document.querySelector('.buttons-container');
        const counterElement = document.getElementById('counter');
        const pleadMessage = document.getElementById('plead-message');
        const thankMessage = document.getElementById('thank-message');
        const mainMessage = document.getElementById('main-message');
        const countdownElement = document.getElementById('countdown');
        const overlay = document.getElementById('overlay');
        
        let rejectCount = 0;
        let agreed = false;
        let countdownInterval;
        
        // 初始位置设置
        function setInitialPosition() {
            // 同意按钮居中
            agreeBtn.style.left = '50%';
            agreeBtn.style.top = '50%';
            
            // 拒绝按钮放在同意按钮右侧
            const agreeRect = agreeBtn.getBoundingClientRect();
            const containerRect = buttonsContainer.getBoundingClientRect();
            
            rejectBtn.style.left = (agreeRect.right - containerRect.left + 20) + 'px';
            rejectBtn.style.top = (agreeRect.top - containerRect.top) + 'px';
        }
        
        // 随机移动拒绝按钮
        function moveRejectButton() {
            if (agreed) return; // 如果已经同意，不再移动拒绝按钮
            
            const containerRect = buttonsContainer.getBoundingClientRect();
            const rejectRect = rejectBtn.getBoundingClientRect();
            const agreeRect = agreeBtn.getBoundingClientRect();
            
            // 确保拒绝按钮不会与同意按钮重叠
            let newX, newY;
            let attempts = 0;
            const maxAttempts = 50;
            
            do {
                newX = Math.random() * (containerRect.width - rejectRect.width);
                newY = Math.random() * (containerRect.height - rejectRect.height);
                attempts++;
            } while (
                attempts < maxAttempts && 
                isOverlapping(newX, newY, rejectRect.width, rejectRect.height, 
                             agreeRect.left - containerRect.left, agreeRect.top - containerRect.top, 
                             agreeRect.width, agreeRect.height)
            );
            
            rejectBtn.style.left = newX + 'px';
            rejectBtn.style.top = newY + 'px';
            
            // 更新计数器
            rejectCount++;
            counterElement.textContent = rejectCount;
            
            // 如果点击超过10次，显示"求求了"
            if (rejectCount >= 10) {
                pleadMessage.classList.add('show');
            }
        }
        
        // 检查两个元素是否重叠
        function isOverlapping(x1, y1, w1, h1, x2, y2, w2, h2) {
            return !(x1 + w1 < x2 || x1 > x2 + w2 || y1 + h1 < y2 || y1 > y2 + h2);
        }
        
        // 创建彩色纸屑效果
        function createConfetti() {
            const colors = ['#f00', '#0f0', '#00f', '#ff0', '#f0f', '#0ff'];
            for (let i = 0; i < 100; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.left = Math.random() * 100 + '%';
                confetti.style.animation = `confetti-fall ${Math.random() * 3 + 2}s linear forwards`;
                confetti.style.animationDelay = Math.random() * 2 + 's';
                document.querySelector('.container').appendChild(confetti);
            }
        }
        
        // 同意按钮点击事件
        agreeBtn.addEventListener('click', function() {
            if (agreed) return;
            
            agreed = true;
            
            // 禁用按钮
            agreeBtn.classList.add('disabled');
            rejectBtn.classList.add('disabled');
            
            // 隐藏"求求了"消息
            pleadMessage.classList.remove('show');
            
            // 显示感谢消息
            thankMessage.classList.add('show');
            
            // 更新主消息
            mainMessage.textContent = "孙局标识！";
            
            // 开始10秒倒计时
            let secondsLeft = 10;
            countdownElement.textContent = `申请将在 ${secondsLeft} 秒后确认...`;
            
            countdownInterval = setInterval(function() {
                secondsLeft--;
                countdownElement.textContent = `申请将在 ${secondsLeft} 秒后确认...`;
                
                if (secondsLeft <= 0) {
                    clearInterval(countdownInterval);
                    
                    // 显示确认界面
                    overlay.classList.add('show');
                    
                    // 创建彩色纸屑效果
                    createConfetti();
                    
                    // 3秒后显示最终消息
                    setTimeout(function() {
                        countdownElement.textContent = "学习已确认！";
                    }, 3000);
                }
            }, 1000);
        });
        
        // 拒绝按钮事件
        rejectBtn.addEventListener('mouseover', function() {
            if (!agreed) {
                moveRejectButton();
            }
        });
        
        rejectBtn.addEventListener('click', function() {
            if (!agreed) {
                moveRejectButton();
            }
        });
        
        // 初始化
        window.addEventListener('load', setInitialPosition);
        window.addEventListener('resize', setInitialPosition);
    </script>
</body>
</html>
